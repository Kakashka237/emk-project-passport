name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Тесты бизнес-логики Emk.Core
        run: dotnet test tests/Emk.Core.Tests --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка контракта api/openapi.yaml
        run: |
          pip install openapi-spec-validator==0.7.1
          openapi-spec-validator api/openapi.yaml
